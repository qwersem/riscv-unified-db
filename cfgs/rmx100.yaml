# yaml-language-server: $schema=../spec/schemas/config_schema.json
---
$schema: config_schema.json#
kind: architecture configuration
type: partially configured
name: rmx100
description: |
  RMX-100 processor configuration supporting configurable RISC-V ISA extensions.
  Default profile includes RV32I + Zicsr, Zifencei, Zihintpause, Zce, Zba, Zbb, Zbs, Zicond, Zicbom, Zicbop.
  Additional optional extensions available for different template configurations.
params:
  MXLEN: 32
mandatory_extensions:
  - name: "I"
    version: ">= 0"
  - name: "Sm"
    version: ">= 0"
  - name: "Zicsr"
    version: ">= 1.0"
  - name: "Zifencei"
    version: ">= 1.0"
  - name: "Zihintpause"
    version: ">= 1.0"
  - name: "Zce"
    version: ">= 1.0"
  - name: "Zba"
    version: ">= 1.0"
  - name: "Zbb"
    version: ">= 1.0"
  - name: "Zbs"
    version: ">= 1.0"
  - name: "Zicond"
    version: ">= 1.0"
  - name: "Zicbom"
    version: ">= 1.0"
  - name: "Zicbop"
    version: ">= 1.0"
non_mandatory_extensions:
  - name: "A"
    version: ">= 1.0"
  - name: "M"
    version: ">= 1.0"
  - name: "Zfinx"
    version: ">= 1.0"
  - name: "Zdinx"
    version: ">= 1.0"
additional_extensions: false
